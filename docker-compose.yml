services:
  db:
    container_name: laravel-db
    image: postgres:18
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laravel}
    volumes:
      - ./pgdata:/var/lib/postgresql:rw
    ports:
      - "5432:5432"
    networks:
      - laravel

  php:
    container_name: laravel-php
    build:
      context: ./docker/php-fpm
    volumes:
      - ./docker/php-fpm/custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./laravel:/var/www/laravel
      # Фикс для windows (ускорение работы)
      - /var/www/laravel/vendor
    networks:
      - laravel

  nginx:
    container_name: laravel-nginx
    build:
      context: ./docker/nginx
    volumes:
      - ./laravel:/var/www/laravel
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - php
      - db
    networks:
      - laravel

volumes:
  pgdata:

networks:
  laravel-posts:
